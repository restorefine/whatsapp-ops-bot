# Use when another web server on the host already owns ports 80/443.
# The bundled Caddy is skipped and the app listens on 127.0.0.1:8081 only,
# for the existing proxy to forward bot.example.com to.
#
# Enable it by adding this line to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.shared-proxy.yml
services:
  app:
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8081}:8080"

  caddy:
    profiles: ["bundled-caddy"]
